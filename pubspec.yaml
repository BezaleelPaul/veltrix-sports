name: veltrix_sports
description: "Veltrix Sports - Coaching, Events & Ticketing Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.16
  lottie: ^3.2.0
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.0

  # State Management
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^14.6.0

  # Networking
  dio: ^5.7.0
  json_annotation: ^4.12.0

  # Storage
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0

  # Firebase
  firebase_core: ^3.12.0
  firebase_messaging: ^15.1.0

  # Device & Platform
  permission_handler: ^11.4.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.0

  # Payments
  razorpay_flutter: ^1.4.0

  # UI Components
  cached_network_image: ^3.4.0

  # Charts
  fl_chart: ^0.70.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  logger: ^2.5.0

  # Loading
  flutter_easyloading: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
